<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThermoChem Bench — Mechanical & Chemical Engineering Workbench</title>
    <meta name="description" content="Interactive engineering calculation workbench with live parametric plots for thermodynamics, fluid mechanics, distillation, phase equilibria, and heat treatment." />
    <meta property="og:title" content="ThermoChem Bench — Mechanical & Chemical Engineering Workbench" />
    <meta property="og:description" content="Interactive engineering calculation workbench with live parametric plots for thermodynamics, fluid mechanics, distillation, phase equilibria, and heat treatment." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Paste this entire snippet unchanged just before </body> on all four engineering bench pages. -->
    <style>
      .bench-footer {
        --bf-bg: #F1E8D4;
        --bf-text: #3B3A38;
        --bf-link: #1F4E79;
        --bf-link-hover: #133452;
        --bf-rule: #3B3A38;
        --bf-flourish: #6F6D68;
        --bf-current: rgba(217, 164, 65, 0.22);

        position: static;
        width: 100%;
        margin: 0;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
        background-color: var(--bf-bg);
        color: var(--bf-text);
        border-top: 1px solid var(--bf-rule);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 16px;
        line-height: 1.5;
        text-align: center;
        box-sizing: border-box;
      }

      .bench-footer *,
      .bench-footer *::before,
      .bench-footer *::after {
        box-sizing: border-box;
      }

      @media (prefers-color-scheme: dark) {
        .bench-footer {
          --bf-bg: #26211A;
          --bf-text: #D8D2C4;
          --bf-link: #7FB0DB;
          --bf-link-hover: #5E95C7;
          --bf-rule: #8C8A85;
          --bf-flourish: #8C8A85;
          --bf-current: rgba(217, 164, 65, 0.16);
        }
      }

      .bench-footer .bench-footer__inner {
        max-width: 680px;
        margin: 0 auto;
      }

      .bench-footer .bench-footer__flourish {
        display: flex;
        justify-content: center;
        margin: 0 auto 18px;
        color: var(--bf-flourish);
      }

      .bench-footer .bench-footer__flourish svg {
        display: block;
        width: 168px;
        height: 14px;
      }

      .bench-footer .bench-footer__nav {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin: 0 auto 16px;
        border-top: 1px solid var(--bf-rule);
        border-left: 1px solid var(--bf-rule);
      }

      .bench-footer .bench-footer__cell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 10px;
        border-right: 1px solid var(--bf-rule);
        border-bottom: 1px solid var(--bf-rule);
        font-size: 15px;
        line-height: 1.3;
        text-decoration: none;
      }

      .bench-footer a.bench-footer__cell {
        color: var(--bf-link);
        font-weight: 400;
      }

      .bench-footer a.bench-footer__cell:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer a.bench-footer__cell:focus-visible {
        color: var(--bf-link-hover);
        text-decoration: underline;
        outline: 2px solid var(--bf-link);
        outline-offset: -3px;
      }

      .bench-footer .bench-footer__cell[aria-current="page"] {
        background-color: var(--bf-current);
        color: var(--bf-text);
        font-weight: 700;
      }

      .bench-footer .bench-footer__central-wrap {
        margin: 0 0 14px;
      }

      .bench-footer .bench-footer__central {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 6px 14px;
        color: var(--bf-link);
        font-size: 18px;
        line-height: 1.35;
        text-decoration: none;
      }

      .bench-footer .bench-footer__central:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer .bench-footer__central:focus-visible {
        color: var(--bf-link-hover);
        text-decoration: underline;
        outline: 2px solid var(--bf-link);
        outline-offset: 2px;
      }

      .bench-footer .bench-footer__more {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: var(--bf-text);
      }

      .bench-footer .bench-footer__url {
        color: var(--bf-link);
        text-decoration: none;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .bench-footer .bench-footer__url:hover {
        color: var(--bf-link-hover);
        text-decoration: underline;
      }

      .bench-footer .bench-footer__url:focus-visible {
        color: var(--bf-link-hover);
        text-decoration: underline;
        outline: 2px solid var(--bf-link);
        outline-offset: 2px;
      }

      @media (max-width: 600px) {
        .bench-footer .bench-footer__nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .bench-footer .bench-footer__url {
          display: block;
          margin-top: 2px;
        }
      }
    </style>

    <footer class="bench-footer">
      <div class="bench-footer__inner">
        <div class="bench-footer__flourish" aria-hidden="true">
          <svg viewBox="0 0 168 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="1" y1="1" x2="1" y2="13" stroke="currentColor" stroke-width="1" />
            <line x1="167" y1="1" x2="167" y2="13" stroke="currentColor" stroke-width="1" />
            <line x1="4" y1="7" x2="164" y2="7" stroke="currentColor" stroke-width="1" />
            <polygon points="1,7 9,4 9,10" fill="currentColor" />
            <polygon points="167,7 159,4 159,10" fill="currentColor" />
          </svg>
        </div>

        <nav class="bench-footer__nav" aria-label="Engineering benches">
          <a class="bench-footer__cell" href="https://nirmalya-panigrahi.github.io/Structural-Engineering-Bench/">Structural</a>
          <a class="bench-footer__cell" href="https://nirmalya-panigrahi.github.io/Process-Engineering-Bench/">Process</a>
          <a class="bench-footer__cell" href="https://nirmalya-panigrahi.github.io/Control-Engg-Bench/">Control</a>
          <a class="bench-footer__cell" href="https://nirmalya-panigrahi.github.io/Circuit-Bench-Lab/">Circuit</a>
        </nav>

        <div class="bench-footer__central-wrap">
          <a class="bench-footer__central" href="https://nirmalya-panigrahi.github.io/engineering-bench/">All engineering benches &rarr;</a>
        </div>

        <p class="bench-footer__more">
          Find more tools at: <a class="bench-footer__url" href="https://nirmalya-panigrahi.github.io/">https://nirmalya-panigrahi.github.io/</a>
        </p>
      </div>
    </footer>

    <script>
      (function () {
        function normPath(p) {
          return p.replace(/\/index\.html$/i, "/").replace(/\/+$/, "").toLowerCase();
        }
        var current = normPath(window.location.pathname);
        var links = document.querySelectorAll(".bench-footer .bench-footer__nav a");
        for (var i = 0; i < links.length; i++) {
          var link = links[i];
          if (normPath(link.pathname) === current) {
            var span = document.createElement("span");
            span.className = "bench-footer__cell";
            span.setAttribute("aria-current", "page");
            span.textContent = link.textContent;
            link.parentNode.replaceChild(span, link);
            break;
          }
        }
      })();
    </script>
  </body>
</html>
